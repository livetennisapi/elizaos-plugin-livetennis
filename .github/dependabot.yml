version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native compiler) breaks the tsup dts build: rollup-plugin-dts
      # reads compiler API members TS 7 does not expose. Drop this rule when tsup
      # builds declarations with TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
